[workspace]
members = [
    "crates/cyclotomic-rings",
    "crates/latticefold",
    "crates/latticefold-plus",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
ark-crypto-primitives = { version = "0.4.0", default-features = false, features = [
    "sponge",
] }
ark-ff = { version = "0.4.2", default-features = false }
ark-serialize = { version = "0.4.2", features = ["derive"] }
ark-std = { version = "0.4.0", default-features = false }
criterion = "0.5.1"
cyclotomic-rings = { path = "crates/cyclotomic-rings", default-features = false }
latticefold = { path = "crates/latticefold", default-features = false }
num-bigint = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
proc-macro2 = "1.0.106"
quote = "1.0.45"
rand = { version = "0.8.6", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
stark-rings = { git = "https://github.com/NethermindEth/stark-rings.git", branch = "main", default-features = false }
stark-rings-linalg = { git = "https://github.com/NethermindEth/stark-rings.git", branch = "main", default-features = false }
stark-rings-poly = { git = "https://github.com/NethermindEth/stark-rings.git", branch = "main", default-features = false }
fhe = { git = "https://github.com/gnosisguild/fhe.rs.git", rev = "cb83e5e1780ea666f611e3463ab1ad1a68864675", package = "fhe", default-features = false }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs.git", rev = "cb83e5e1780ea666f611e3463ab1ad1a68864675", package = "fhe-traits" }
fhe-rand = { version = "0.9.2", package = "rand" }
thiserror = { version = "2.0.18", default-features = false }
toml = "0.8.23"
[workspace.metadata.docs.rs]
# To build locally, use 
# RUSTDOCFLAGS="--html-in-header docs-header.html" cargo doc --no-deps --document-private-items --open
rustdoc-args = ["--html-in-header", "docs-header.html"]

# Step 2 (VDKG plan §12.2): fork of stark-rings carrying the custom
# LatticeFold-congruent ring models (interfold + N4096); see
# crates/latticefold/examples/interfold/ring/dkg_ring_model.rs.
[patch."https://github.com/NethermindEth/stark-rings.git"]
stark-rings = { git = "https://github.com/0xjei/stark-rings.git", branch = "interfold" }
stark-rings-linalg = { git = "https://github.com/0xjei/stark-rings.git", branch = "interfold" }
stark-rings-poly = { git = "https://github.com/0xjei/stark-rings.git", branch = "interfold" }
